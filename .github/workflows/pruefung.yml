# pruefung.yml — Automatische Prüfung bei jedem Push.
#
# Warum? Das Makefile prüft Shell-Syntax, Python-Syntax, das Format der
# Konfigurationsdateien und (mit shellcheck) typische Shell-Fallen. Bisher
# lief es nur, wenn jemand daran dachte. Hier läuft es immer.
#
# Was NICHT hier läuft: tests/abnahme-im-container.sh. Der Test lädt Paper
# herunter, startet einen echten Server und braucht mehrere Minuten — er
# bleibt vorerst ein Handlauf vor einer Veröffentlichung.

name: Prüfung

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  makefile:
    name: make (Syntax, Konfiguration, shellcheck)
    # Fest statt ubuntu-latest: Der Wechsel auf ein neues Ubuntu soll eine
    # bewusste Aenderung hier sein, nicht nebenbei mitten in einem Push.
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: shellcheck installieren
        # Auf dem Runner ist shellcheck meist schon da. Das Makefile
        # überspringt den Schritt sonst stillschweigend — in der
        # automatischen Prüfung soll er aber wirklich laufen.
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            for versuch in 1 2 3; do
              sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && break
              [ "$versuch" = 3 ] && exit 1
              echo "Paketquellen nicht erreichbar (Versuch $versuch), neuer Versuch in 20 s"; sleep 20
            done
          fi
          shellcheck --version

      - name: pyflakes installieren
        # Findet fehlende und ueberfluessige Importe sowie undefinierte Namen.
        # Bei der Aufteilung von app.py in Module hat es 17 solcher Stellen auf
        # einen Schlag gefunden; das Makefile ueberspringt es sonst still.
        run: |
          python3 -m pip install --quiet pyflakes
          pyflakes --version

      # Ohne rclone ueberspringt "make kopien" die Cloud-Kopie -- laut, aber
      # dann ist sie hier ungeprueft. Gegen einen verschluesselten Ordner,
      # ohne Netz und ohne Zugangsdaten.
      # Direkt von rclone.org statt per apt: Am 11.11.2026 konnte der Runner
      # den Ubuntu-Spiegel wiederholt nicht aufloesen ("Temporary failure
      # resolving"); drei apt-Versuche kosteten 15 min und halfen nicht.
      # 1.60.1 ist die Version, die Debian per apt auf den Pi bringt. Die
      # Pruefsumme steht fest, damit nur genau diese Datei laeuft.
      - name: rclone installieren
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o rclone.zip https://downloads.rclone.org/v1.60.1/rclone-v1.60.1-linux-amd64.zip
          echo "fd6bc19cc7fadb13538cc109128bf92ef47762a83a3eaf2ab699b03bb2a1fe32  rclone.zip" | sha256sum -c -
          unzip -q -j rclone.zip '*/rclone'
          sudo install -m 755 rclone /usr/local/bin/rclone
          rclone version | head -n1
      - name: make
        run: make
