# server.properties — Vorlage für den Pi-MCS Survival-Server.
#
# Abgestimmt auf: Raspberry Pi 5 (8 GB), Survival-Modus, maximal 5 Spieler.
# Hinweis: Der Server schreibt diese Datei beim ersten Start neu und
# entfernt dabei alle Kommentare — das ist normal.
#
# ---------------------------------------------------------------------------
# 2026-08-26: Diese Vorlage beschrieb einen ANDEREN Server als den, der auf
# dem gepflegten Pi tatsächlich lief — anderer Spielmodus, andere
# Schwierigkeit, anderer Port, und `level-name` fehlte ganz.
#
# Das war kein Schönheitsfehler, sondern eine Lücke im Deploy-Weg: Solange
# die Vorlage etwas anderes sagt als die Installation, meldet `deploy.sh`
# bei JEDEM Lauf dieselben fünf Abweichungen. Dieses Dauerrauschen macht
# echte Abweichungen unsichtbar — und `--konfig-uebernehmen` war damit
# dauerhaft unbenutzbar, weil es den Server umkonfiguriert hätte.
#
# Die Vorlage bildet jetzt den laufenden Server ab. Abweichungen, die
# `deploy.sh` künftig meldet, sind damit echte Abweichungen.
# ---------------------------------------------------------------------------
#
# Die wichtigsten Stellschrauben (Erklärung siehe README):
#   view-distance        = Sichtweite in Chunks (Grafik/Netzwerk)
#   simulation-distance  = Umkreis, in dem die Welt "lebt" (CPU-Last)
#   white-list           = nur eingeladene Spieler dürfen rein (Sicherheit!)

# --- Welt --------------------------------------------------------------------
# Der Name des Weltordners. Der Installationsassistent fragt danach; hier
# steht der Standard für eine frische Installation.
#
# ACHTUNG für alle Skripte und für jeden, der hier nachsieht: Dieser Wert
# ist INSTANZSPEZIFISCH und weicht auf einer gewachsenen Installation
# regelmäßig ab: Wer seine Welt einmal umbenannt hat, findet hier ihren
# Namen — und die Ordner "world*" daneben können Altbestand sein. Wer
# Weltdaten sucht, sichert oder zurückspielt, muss diesen Wert AUSLESEN,
# nicht raten. Meldet `deploy.sh` hier eine Abweichung, ist
# das richtig so und kein Fehler.
# Pi-MCS: instanzspezifisch — gehoert der Installation, nie ausrollen
level-name=world

# --- Spielmodus -------------------------------------------------------------
gamemode=survival
difficulty=easy
hardcore=false
# spawn-monsters steht hier NICHT mehr, und das ist Absicht: Paper 26.2
# kennt den Schluessel nicht mehr. Nachgemessen am 02.09.2026 an einer
# server.properties, die Paper selbst vollstaendig geschrieben hatte (71
# Schluessel, darunter op-permission-level und spawn-protection) -- darin
# fehlen spawn-monsters, spawn-animals und spawn-npcs alle drei. Wer den
# Schluessel wieder eintraegt, erzeugt eine Dauermeldung von deploy.sh
# ueber einen Wert, den Paper beim naechsten Start wegwirft. Ob Monster
# erscheinen, entscheidet heute die Schwierigkeit (peaceful = keine).
# Verhindert, dass fliegende Spieler fälschlich rausgeworfen werden
allow-flight=true
# Kommandoblöcke aus, wie bei Minecraft selbst. Hier bewusst explizit,
# damit der Wert nicht unbemerkt vom Standard abhaengt.
#
# ABER: Ob ein Server Kommandobloecke will, entscheidet sein Betreiber, nicht
# diese Vorlage — es ist eine Spielentscheidung wie der Spielmodus. Deshalb
# ist der Schluessel seit dem 2026-09-02 als instanzspezifisch markiert: Die
# Vorlage bleibt beim vorsichtigen `false` (das ist auch Minecrafts eigener
# Standard, und wer Pi-MCS frisch installiert, soll nicht ueberrascht werden),
# aber ein Server, der `true` stehen hat, behaelt es.
#
# Vorher meldete `deploy.sh` das bei jedem Lauf als Wertabweichung, und
# `--konfig-uebernehmen` haette die Bloecke bei gestopptem Server lautlos
# abgeschaltet. Genau die Sorte Dauermeldung, die echte Abweichungen
# unsichtbar macht.
# Pi-MCS: instanzspezifisch — gehoert der Installation, nie ausrollen
enable-command-block=false

# --- Spieler & Sicherheit ---------------------------------------------------
max-players=5
# Nur Spieler auf der Whitelist dürfen verbinden — Pflicht, wenn der
# Port ins Internet freigegeben ist! Spieler einladen mit:
#   mcs cmd "whitelist add SPIELERNAME"
white-list=true
enforce-whitelist=true
# Echtheitsprüfung der Minecraft-Accounts bei Mojang (niemals abschalten,
# sonst kann sich jeder mit beliebigem Namen anmelden)
online-mode=true
# Kein Bauschutz um den Spawn
spawn-protection=0

# --- Leistung (Raspberry Pi 5) ----------------------------------------------
# Diese Werte sind am 2026-07-27 auf einem Pi 5 (8 GB) unter der Last
# von fünf Spielern nachgemessen worden. Begründung und Messwerte:
# docs/optimierung-2026-07-27.md (im Repository)
#
# Sichtweite: 16 Chunks. Sie kostet Arbeitsspeicher und Netzwerk, aber
# kaum Tick-Zeit — dafür ist simulation-distance zuständig.
view-distance=16
# Simulationsweite: der teure Wert. 10 heißt (2·10+1)² = 441 voll
# getickte Chunks je Spieler. Darf kleiner sein als view-distance.
simulation-distance=10
# Welt-Speicherung asynchron — deutlich flüssiger; die NVMe-SSD und das
# nächtliche Backup fangen das geringe Restrisiko bei Stromausfall ab
sync-chunk-writes=false
# LZ4 statt deflate: auf dem Cortex-A76 ist die Kompression die teuerste
# Stelle beim Chunk-Lesen und -Schreiben. Preis sind ~11 % größere
# Region-Dateien. Bestehende Chunks bleiben lesbar, die Kompressionsart
# steht je Chunk in der Datei.
region-file-compression=lz4
# Server pausiert sich selbst, wenn 5 Minuten niemand online ist.
# Spart CPU und Strom; beim nächsten Verbinden geht es sofort weiter.
pause-when-empty-seconds=300
# Wie weit Bewegungen von Kreaturen an die Clients gemeldet werden, in
# Prozent der Sichtweite. 85 statt 100 spart spürbar Netzwerk- und
# CPU-Last, ohne dass es im Spiel auffällt.
entity-broadcast-range-percentage=85
# Ab wie vielen Byte ein Netzwerkpaket komprimiert wird. Siehe README,
# Abschnitt Performance — auf einem LAN-Server mit wenigen Spielern
# kostet Kompression eher CPU, als sie Bandbreite spart.
network-compression-threshold=256
# --- Sonstiges ----------------------------------------------------------------
# Der Begrüßungstext in der Serverliste. Wie level-name gehört er der
# einzelnen Installation, nicht der Vorlage — deploy.sh übernimmt ihn
# deshalb nie (siehe INSTANZ_SCHLUESSEL dort).
# §-Codes färben: §2 = dunkelgrün, §l = fett.
# Pi-MCS: instanzspezifisch — gehoert der Installation, nie ausrollen
motd=Ein Pi-MCS Server
# Pi-MCS: instanzspezifisch — gehoert der Installation, nie ausrollen
server-port=25565

# ----------------------------------------------------------------------------
# Bewusst NICHT gesetzt
# ----------------------------------------------------------------------------
# player-idle-timeout — trennt Spieler nach X Minuten ohne Eingabe. Das
#   spart Tickzeit, ist aber eine im Spiel SICHTBARE Änderung: AFK-Farmen
#   hören auf zu laufen, und wer kurz weggeht, fliegt raus. Am 2026-08-26
#   stand hier kurzzeitig "20" unter der Überschrift "Leistung" — das war
#   an der falschen Stelle. Wer es will, trägt es bewusst ein.
