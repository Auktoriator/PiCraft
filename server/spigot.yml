# This is the Spigot configuration file for Paper.
# As you can see, there's tons to configure. Some options may impact gameplay, so use
# with caution, and make sure you know what each option does before configuring.
#
# If you need help with the configuration or have any questions related to Paper,
# join us in our Discord or check the docs page.
#
# File Reference: https://docs.papermc.io/paper/reference/spigot-configuration/
# Docs: https://docs.papermc.io/
# Discord: https://discord.gg/papermc
# Website: https://papermc.io/
#
# ---------------------------------------------------------------------------
# Pi-MCS: Diese Datei ist ein vollstaendiger Abzug der Paper-Voreinstellungen,
# in dem einzelne Werte bewusst geaendert wurden. Jede solche Stelle ist mit
# "# Pi-MCS:" markiert und nennt die Voreinstellung sowie den Grund.
# Alles ohne diese Markierung ist unveraendert.
#
# Die Markierungen wurden am 2026-07-28 gegen einen frisch erzeugten Abzug
# von Paper 26.2 Build 84 geprueft, und am 2026-10-21 erneut gegen Paper
# 26.3 Build 210 (einmal in einem leeren Verzeichnis gestartet, Dateien
# verglichen): Jede Abweichung vom Abzug ist markiert, jede genannte
# Voreinstellung stimmt noch. Was 26.3 neu hat oder nicht mehr kennt, ist
# nachgezogen. Nach einem Versionswechsel lohnt sich derselbe Vergleich
# erneut - Paper kann Voreinstellungen aendern.
# Hintergrund und Messwerte: docs/optimierung-2026-07-27.md
# ---------------------------------------------------------------------------

settings:
  debug: false
  bungeecord: false
  # Pi-MCS: von false geaendert. Die Spielerdatenbank wird nur beim Stoppen
  # Pi-MCS: geschrieben statt bei jeder An-/Abmeldung - weniger kleine
  # Pi-MCS: Schreibzugriffe auf die SSD.
  save-user-cache-on-stop-only: true
  sample-count: 12
  player-shuffle: 0
  user-cache-size: 1000
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  timeout-time: 60
  # Pi-MCS: von true auf false geaendert. Spigot wuerde bei einem Absturz
  # Pi-MCS: das Skript unten aufrufen - das es in dieser Installation gar
  # Pi-MCS: nicht gibt. Fuer Neustarts ist systemd zustaendig
  # Pi-MCS: (Restart=always in minecraft.service).
  restart-on-crash: false
  restart-script: ./start.sh
  # Pi-MCS: von 4 gesenkt. Vier Netzwerk-Threads auf vier Kernen nehmen dem
  # Pi-MCS: Server-Thread unnoetig Rechenzeit weg; bei maximal 5 Spielern
  # Pi-MCS: reichen 2.
  netty-threads: 2
  attribute:
    maxAbsorption:
      max: 2048.0
    maxHealth:
      max: 1024.0
    movementSpeed:
      max: 1024.0
    attackDamage:
      max: 2048.0
  log-villager-deaths: true
  log-named-deaths: true
messages:
  whitelist: You are not whitelisted on this server!
  unknown-command: Unknown command. Type "/help" for help.
  server-full: The server is full!
  outdated-client: Outdated client! Please use {0}
  outdated-server: Outdated server! I'm still on {0}
  restart: Server is restarting
advancements:
  disable-saving: false
  disabled:
  - minecraft:story/disabled
world-settings:
  default:
    seed-abandonedcamp: 91231127
    below-zero-generation-in-existing-chunks: true
    view-distance: default
    simulation-distance: default
    # Pi-MCS: von item 0.5 / exp -1.0 angehoben. Gegenstaende und
    # Pi-MCS: Erfahrungskugeln werden in groesserem Umkreis zusammengefasst -
    # Pi-MCS: das spart getickte Entitaeten. exp -1.0 hiesse: gar nicht
    # Pi-MCS: zusammenfassen.
    merge-radius:
      item: 2.5
      exp: 3.0
    # Pi-MCS: von 8 gesenkt. Mobs entstehen naeher am Spieler, dadurch
    # Pi-MCS: weniger davon in geladenen, aber unbesuchten Chunks.
    mob-spawn-range: 6
    item-despawn-rate: 6000
    arrow-despawn-rate: 1200
    trident-despawn-rate: 1200
    zombie-aggressive-towards-villager: true
    nerf-spawner-mobs: false
    enable-zombie-pigmen-portal-spawns: true
    wither-spawn-sound-radius: 0
    end-portal-sound-radius: 0
    hanging-tick-frequency: 100
    thunder-chance: 100000
    unload-frozen-chunks: false
    growth:
      cactus-modifier: 100
      cane-modifier: 100
      melon-modifier: 100
      mushroom-modifier: 100
      pumpkin-modifier: 100
      sapling-modifier: 100
      beetroot-modifier: 100
      carrot-modifier: 100
      potato-modifier: 100
      torchflower-modifier: 100
      wheat-modifier: 100
      netherwart-modifier: 100
      vine-modifier: 100
      cocoa-modifier: 100
      bamboo-modifier: 100
      sweetberry-modifier: 100
      kelp-modifier: 100
      twistingvines-modifier: 100
      weepingvines-modifier: 100
      cavevines-modifier: 100
      glowberry-modifier: 100
      pitcherplant-modifier: 100
    # Pi-MCS: Aktivierungsradien gesenkt (Voreinstellung in Klammern):
    # Pi-MCS:   animals 24 (32), monsters 24 (32), misc 8 (16),
    # Pi-MCS:   water 12 (16), villagers 24 (32), flying-monsters 24 (32)
    # Pi-MCS: Nur was innerhalb dieses Radius um einen Spieler liegt, wird
    # Pi-MCS: voll getickt. Der spuerbarste Einzelhebel gegen Tick-Last.
    # Pi-MCS: raiders bleibt auf 64 - das IST die Voreinstellung.
    entity-activation-range:
      animals: 24
      monsters: 24
      raiders: 64
      misc: 8
      water: 12
      villagers: 24
      flying-monsters: 24
      wake-up-inactive:
        animals-max-per-tick: 4
        animals-every: 1200
        animals-for: 100
        monsters-max-per-tick: 8
        monsters-every: 400
        monsters-for: 100
        villagers-max-per-tick: 4
        villagers-every: 600
        villagers-for: 100
        flying-monsters-max-per-tick: 8
        flying-monsters-every: 200
        flying-monsters-for: 100
      villagers-work-immunity-after: 100
      villagers-work-immunity-for: 20
      villagers-active-for-panic: true
      tick-inactive-villagers: true
      ignore-spectators: false
    entity-tracking-range:
      players: 128
      animals: 96
      monsters: 96
      misc: 96
      display: 128
      other: 64
    ticks-per:
      hopper-transfer: 8
      hopper-check: 1
    hopper-amount: 1
    hopper-can-load-chunks: false
    dragon-death-sound-radius: 0
    seed-village: 10387312
    seed-desert: 14357617
    seed-igloo: 14357618
    seed-jungle: 14357619
    seed-swamp: 14357620
    seed-monument: 10387313
    seed-shipwreck: 165745295
    seed-ocean: 14357621
    seed-outpost: 165745296
    seed-endcity: 10387313
    seed-slime: 987234911
    seed-nether: 30084232
    seed-mansion: 10387319
    seed-fossil: 14357921
    seed-portal: 34222645
    seed-ancientcity: 20083232
    seed-trailruins: 83469867
    seed-trialchambers: 94251327
    seed-buriedtreasure: 10387320
    seed-mineshaft: default
    seed-stronghold: default
    hunger:
      jump-walk-exhaustion: 0.05
      jump-sprint-exhaustion: 0.2
      combat-exhaustion: 0.1
      regen-exhaustion: 6.0
      swim-multiplier: 0.01
      sprint-multiplier: 0.1
      other-multiplier: 0.0
    max-tnt-per-tick: 100
    max-tick-time:
      tile: 50
      entity: 50
    verbose: false
  # Pi-MCS: Dieser Abschnitt stammt von WorldEdit, nicht von der
  # Pi-MCS: Leistungsoptimierung. Er entsteht automatisch, sobald das
  # Pi-MCS: Plugin einmal eine Regeneration ausgefuehrt hat.
  worldeditregentempworld:
    verbose: false
players:
  disable-saving: false
config-version: 13
stats:
  disable-saving: false
  forced-stats: {}
commands:
  log: true
  tab-complete: 0
  send-namespaced: true
  spam-exclusions:
  - /skill
  silent-commandblock-console: false
  replace-commands:
  - setblock
  - summon
  - testforblock
  - tellraw
  enable-spam-exclusions: false
